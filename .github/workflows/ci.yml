name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main; only superseded pull request pushes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LLMPROXY_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/postgres
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check PostgreSQL and Docker readiness
        env:
          LLMPROXY_CREDENTIAL_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          printf 'LLMPROXY_CREDENTIAL_CONTAINER=%s\n' "$LLMPROXY_CREDENTIAL_CONTAINER" >> "$GITHUB_ENV"
          docker exec "$LLMPROXY_CREDENTIAL_CONTAINER" pg_isready -U postgres
          docker info
          docker pull postgres:18
          docker pull postgres:18-alpine
      - run: cargo test --locked
      # This run is also the test run: it fails if a test fails or line coverage drops below 99%.
      - run: cargo llvm-cov --locked --fail-under-lines 99 --show-missing-lines
        env:
          CARGO_TARGET_DIR: target/cov
