[package]
name = "llmproxy"
version = "0.1.0"
edition = "2024"
description = "Authenticated, rate-limited, fully configurable egress proxy for LLM provider APIs"

[dependencies]
rpassword = "=7.5.4"
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
argon2 = { version = "=0.6.0", features = ["zeroize"] }
getrandom = { version = "=0.4.3", features = ["std"] }
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha2 = { version = "=0.11.1", features = ["zeroize"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid", "json"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }

[dev-dependencies]
tokio = { version = "1.54.0", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
